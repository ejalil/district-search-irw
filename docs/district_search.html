<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>District Search — The Maine Monitor</title>

<!-- Brand fonts: Inter (body) + Lora (headlines) — same as the campaign-finance pages -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Leaflet (map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf (point-in-polygon + union/difference for the Maine mask) -->
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

<style>
  :root {
    --blue: #2c6fbb;      /* Democrat */
    --red: #c0392b;       /* Republican */
    --gray: #6b6b6b;      /* Unenrolled */
    --purple: #8e44ad;    /* Independent */
    --accent: #8989f1;    /* Maine Monitor periwinkle */
    --accent-dark: #6b6bd9;
    --text: #1a1a1a;
    --text-secondary: #4a4a4a;   /* darker grays — legible for older readers */
    --text-muted: #6e6e6e;
    --border: #e5e5e5;
    --bg-hover: #fafafc;
    --bg-card: #f9f9fb;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* Larger base type for an older readership — every rem below scales off this. */
  html { font-size: 17px; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background: #fff;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

  /* ── SEARCH ── */
  /* No page header — this embeds on themainemonitor.org, which supplies its own. */
  .search {
    display: flex; gap: 10px; justify-content: center;
    align-items: stretch; flex-wrap: wrap;
    margin: 40px auto 0; max-width: 680px;
  }
  #address {
    flex: 1 1 420px; min-width: 0; min-height: 48px;
    padding: 12px 15px; font-size: 1rem; font-family: inherit;
    color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 4px;
    transition: border-color .12s, box-shadow .12s;
  }
  #address::placeholder { color: var(--text-muted); }
  #address:focus {
    outline: 0; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(137,137,241,0.18);
  }
  #lookup {
    flex: 0 0 auto; min-height: 48px;
    padding: 12px 26px; font-size: 0.95rem; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 4px; cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  #lookup:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  #lookup:disabled { opacity: .6; cursor: default; }

  /* ── LEDE: the answer, written as a sentence ── */
  #result_box { margin: 30px auto 0; max-width: 860px; text-align: center; }
  .lede-addr {
    font-size: 0.76rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .lede-districts {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.3rem; line-height: 1.45; margin-top: 8px;
  }
  .lede-districts b { font-weight: 700; }
  .errbox {
    border-left: 3px solid var(--red); background: rgba(192,57,43,0.05);
    padding: 14px 18px; border-radius: 3px; text-align: left;
  }
  .errbox h4 { color: var(--red); margin: 0 0 .25rem; font-size: 0.95rem; }
  .errbox p { margin: 0; font-size: 0.88rem; color: var(--text-secondary); }

  /* ── TWO-COLUMN: map | representatives ── */
  .page-flex {
    display: flex; gap: 44px; align-items: flex-start; margin-top: 36px;
  }
  .map-col, .rep-col { flex: 1 1 50%; min-width: 0; }
  #map { height: 540px; width: 100%; border-radius: 4px; border: 1px solid var(--border); }
  .leaflet-container { font: inherit; }
  /* Keep keyboard focus visible; only suppress the mouse-click ring. */
  :focus:not(:focus-visible) { outline: none; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent-dark); outline-offset: 2px;
  }
  /* Bigger zoom buttons — easier targets on touch and for older readers */
  .leaflet-control-zoom a {
    width: 38px !important; height: 38px !important;
    line-height: 38px !important; font-size: 20px !important;
  }

  /* Editorial tabs above the map — replaces the default Leaflet layer widget */
  .map-tabs {
    display: flex; gap: 24px;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .map-tabs button {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px;
    color: var(--text-muted); padding: 6px 2px 12px;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .12s, border-color .12s;
  }
  .map-tabs button:hover { color: var(--text); }
  .map-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .map-reset {
    margin-left: auto; text-transform: none !important; letter-spacing: 0 !important;
    font-weight: 600 !important; font-size: 0.8rem !important;
    color: var(--accent-dark) !important;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .map-reset:hover { color: var(--accent-dark) !important; }
  .map-reset[hidden] { display: none; }

  /* Section header — Lora + fading rule, matching the finance pages */
  .ribbon { display: flex; align-items: baseline; gap: 14px; margin-bottom: 2px; }
  .ribbon-text {
    font-family: 'Lora', serif; font-size: 1.45rem; font-weight: 700;
    color: var(--text); line-height: 1.2; white-space: nowrap;
  }
  .ribbon::after {
    content: ''; flex: 1; height: 2px;
    background: linear-gradient(to right, var(--border), transparent); margin-top: 4px;
  }

  /* ── REPRESENTATIVES: a ruled newspaper list, not cards ── */
  .rep-kicker {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-muted); margin: 26px 0 2px;
  }
  .rep-kicker:first-of-type { margin-top: 18px; }
  .rep-hint { color: var(--text-muted); font-size: 0.9rem; padding: 22px 2px; }
  .rep-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    padding: 16px 2px; border-bottom: 1px solid var(--border);
    text-decoration: none; color: inherit;
  }
  .rep-name {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.1rem; font-weight: 700; line-height: 1.3;
  }
  a.rep-row:hover .rep-name { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .rep-party {
    font-size: 0.66rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; margin-left: 8px;
    position: relative; top: -1px;
  }
  .rep-role { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
  .rep-cta {
    font-size: 0.8rem; font-weight: 600; color: var(--accent-dark);
    white-space: nowrap; flex: 0 0 auto;
    text-decoration: underline; text-underline-offset: 3px;  /* reads as a link, even on touch */
  }
  .rep-row.is-empty .rep-name { color: var(--text-muted); font-weight: 400; font-style: italic; }

  @media (max-width: 820px) {
    .page-flex { flex-direction: column; gap: 36px; }
    .map-col, .rep-col { flex: 1 1 100%; width: 100%; }
    .rep-col { order: -1; }        /* the names are the payoff — map comes second */
    #map { height: 380px; }
    .lede-districts { font-size: 1.15rem; }
    .map-tabs { gap: 16px; }
    .rep-row { flex-wrap: wrap; row-gap: 4px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="search">
    <input type="text" id="address" placeholder="e.g. 123 Main St, Portland, ME 04101"
           autocomplete="street-address" enterkeyhint="search" />
    <button id="lookup">Find my districts</button>
  </div>

  <div id="result_box"></div>

  <div class="page-flex" id="results">
    <div class="map-col">
      <div class="map-tabs" id="map_tabs">
        <button data-layer="congressional" class="active">U.S. Congress</button>
        <button data-layer="state_senate">State Senate</button>
        <button data-layer="state_house">State House</button>
        <button id="map_reset" class="map-reset" hidden>Show all of Maine</button>
      </div>
      <div id="map"></div>
    </div>
    <div class="rep-col">
      <div class="ribbon"><span class="ribbon-text">Your Representatives</span></div>
      <div id="rep_box">
        <div class="rep-hint">Search an address to see who represents you.</div>
      </div>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// VERSION A — Voter Guide. Rep rows link out to the campaign-finance pages.
// To make Version B (Statehouse hub), swap CAMPAIGN_FINANCE_LINK for the
// district/lawmaker page URLs and change RESULT_ACTION_LABEL below. Nothing
// else needs to change.
// ─────────────────────────────────────────────────────────────────────────────
const RESULT_ACTION_LABEL = "Campaign finance →";

// PLACEHOLDER LINKS — real per-lawmaker URLs aren't finalized yet. Each function
// receives (district, rep) and returns a URL, or null for "no page yet" (renders
// a plain, non-clickable row). Wire the real URLs here when they're ready.
const CF_BASE = "https://aarushisahejpal.github.io/maine-monitor-campaign-finance/viz/";
const CAMPAIGN_FINANCE_LINK = {
  us_senate:     (d, r) => null,                              // TODO: federal finance page
  congressional: (d, r) => null,                              // TODO: federal finance page
  state_senate:  (d, r) => CF_BASE + "senate.html",          // TODO: swap for per-lawmaker URL
  state_house:   (d, r) => CF_BASE + "house.html",           // TODO: swap for per-lawmaker URL
};

// Party code → display label + brand color (matches the finance pages).
const PARTY = {
  D: { label: "Democrat",    color: "var(--blue)" },
  R: { label: "Republican",  color: "var(--red)" },
  I: { label: "Independent", color: "var(--purple)" },
  U: { label: "Unenrolled",  color: "var(--gray)" },
};

// ── Config: the three boundary layers ───────────────────────────────────────
const DISTRICT_FIELD = "DISTRICT";
const LAYERS = [
  { key:"congressional", file:"Maine_Voting_Districts_2021_US_Congress.geojson",
    label:"Congressional District", border:"#2471a3" },
  { key:"state_senate", file:"Maine_Voting_Districts_2021_State_Senate.geojson",
    label:"State Senate District", border:"#6c3483" },
  { key:"state_house", file:"Maine_Voting_Districts_2021_House.geojson",
    label:"State House District", border:"#a04000" },
];

const HIGHLIGHT_FILL = "#8989f1";      // brand periwinkle
const HIGHLIGHT_BORDER = "#5b5bd6";
const DEFAULT_FILL = "#d9d9d9";

// ── Map setup (CartoDB Positron) ─────────────────────────────────────────────
// zoomSnap 0.25 lets fitBounds pick a fractional zoom, so Maine fills the frame.
// scrollWheelZoom off: scrolling the article past the embed must not zoom the
// map. On phones, one-finger drag is off too (so the map can't hijack page
// scrolling) — pinch-zoom and the +/- buttons still work.
const map = L.map("map", { minZoom: 6, zoomSnap: 0.25, scrollWheelZoom: false }).setView([45.25, -69.0], 6);
if (L.Browser.mobile) map.dragging.disable();
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 30
}).addTo(map);

let marker = null;
let maineBoundary = null;
let maineBounds = null;
let activeLayerKey = "congressional";
const drawn = {};
const highlighted = {};
const geojsonCache = {};

async function loadGeojson(file) {
  if (geojsonCache[file]) return geojsonCache[file];
  const resp = await fetch(file);
  if (!resp.ok) throw new Error("Could not load " + file);
  geojsonCache[file] = await resp.json();
  return geojsonCache[file];
}

// Current officeholders, keyed by (layer, district). Loaded once at startup.
let REPS = null;
const repsReady = fetch("reps.json")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("reps.json " + r.status)))
  .then(j => { REPS = j; })
  .catch(err => { console.error("Could not load reps.json:", err); });

// Gray-mask everything outside Maine and fit the view to the state on load.
async function initMaineView() {
  try {
    const gj = await loadGeojson(LAYERS[0].file);
    maineBoundary = turf.union(gj);
    const world = turf.bboxPolygon([-100, 10, -40, 60]);
    const mask = turf.difference(turf.featureCollection([world, maineBoundary]));

    L.geoJSON(mask, { style: { fillColor: "#e9e9ef", fillOpacity: 0.85, stroke: false }, interactive: false }).addTo(map);
    L.geoJSON(maineBoundary, { style: { fill: false, color: "#999", weight: 1.5 }, interactive: false }).addTo(map);

    maineBounds = L.geoJSON(maineBoundary).getBounds();
    map.fitBounds(maineBounds, { padding: [2,2] });
    map.setMaxBounds(maineBounds.pad(0.4));
  } catch (err) {
    console.error("Could not build Maine mask:", err);
  }
}
initMaineView();

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function styleFor(cfg, districtValue, highlightValue) {
  const isHighlighted = highlightValue != null && String(districtValue) === String(highlightValue);
  if (isHighlighted) {
    return { fillColor: HIGHLIGHT_FILL, fillOpacity: 0.45, color: HIGHLIGHT_BORDER, weight: 3 };
  }
  return { fillColor: DEFAULT_FILL, fillOpacity: 0.25, color: cfg.border, weight: 1 };
}

function buildLayer(cfg, gj){
  if (drawn[cfg.key]) return drawn[cfg.key];
  drawn[cfg.key] = L.geoJSON(gj, {
    style: f => styleFor(cfg, f.properties[DISTRICT_FIELD], highlighted[cfg.key]),
    onEachFeature: (f, lyr) => {
      lyr.on("mouseover", () => lyr.setStyle({ weight: 4 }));
      lyr.on("mouseout", () =>
        lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
    }
  });
  return drawn[cfg.key];
}

function refreshLayerStyle(cfg){
  const layer = drawn[cfg.key];
  if (!layer) return;
  layer.eachLayer(lyr =>
    lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
}

// ── Map tabs: show exactly one district layer at a time ─────────────────────
async function showLayer(key){
  activeLayerKey = key;
  document.querySelectorAll("#map_tabs button[data-layer]").forEach(b =>
    b.classList.toggle("active", b.dataset.layer === key));
  const cfg = LAYERS.find(c => c.key === key);
  const gj = await loadGeojson(cfg.file);
  buildLayer(cfg, gj);
  for (const c of LAYERS) {
    if (drawn[c.key] && c.key !== key && map.hasLayer(drawn[c.key])) map.removeLayer(drawn[c.key]);
  }
  if (!map.hasLayer(drawn[key])) drawn[key].addTo(map);
  if (marker) marker.bringToFront();
}
document.querySelectorAll("#map_tabs button[data-layer]").forEach(b =>
  b.addEventListener("click", () => showLayer(b.dataset.layer)));

// "Show all of Maine" — zoom back out to the full state after a lookup zoom.
document.getElementById("map_reset").addEventListener("click", () => {
  if (maineBounds) map.flyToBounds(maineBounds, { padding: [2,2], duration: 0.8 });
});

// ── Geocode (Nominatim) ──────────────────────────────────────────────────────
async function geocode(address){
  if (!/maine|,\s*me\b/i.test(address)) address = address + ", Maine";
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&addressdetails=1&q="
            + encodeURIComponent(address);
  const resp = await fetch(url, { headers:{ "Accept":"application/json" } });
  if (!resp.ok) return null;
  const data = await resp.json();
  if (!data.length) return null;
  // Read the answer back as a short "street, town, ME zip" line rather than
  // Nominatim's full seven-clause display_name.
  const a = data[0].address || {};
  const street = [a.house_number, a.road].filter(Boolean).join(" ");
  const town = a.city || a.town || a.village || a.hamlet || "";
  const zip = ["ME", a.postcode].filter(Boolean).join(" ");
  const short = [street, town, zip].filter(Boolean).join(", ");
  return { lat:+data[0].lat, lon:+data[0].lon,
           display_name: short || data[0].display_name };
}

function districtAt(gj, lon, lat){
  const pt = turf.point([lon, lat]);
  for (const f of gj.features) {
    if (turf.booleanPointInPolygon(pt, f)) return String(f.properties[DISTRICT_FIELD]);
  }
  return null;
}

// ── Lede: state the answer as a sentence ────────────────────────────────────
function renderResult(displayName, values) {
  const parts = LAYERS
    .filter(c => values[c.key] != null)
    .map(c => `<b>${esc(c.label)} ${esc(values[c.key])}</b>`);
  let sentence;
  if (!parts.length) {
    sentence = "We couldn't match this address to any Maine districts.";
  } else if (parts.length === 1) {
    sentence = `This address is in ${parts[0]}.`;
  } else {
    sentence = `This address is in ${parts.slice(0,-1).join(", ")} and ${parts[parts.length-1]}.`;
  }
  document.getElementById("result_box").innerHTML = `
    <div class="lede-addr">${esc(displayName)}</div>
    <div class="lede-districts">${sentence}</div>`;
}

function renderNotFound(address){
  document.getElementById("result_box").innerHTML =
    `<div class="errbox"><h4>Address not found</h4><p>We couldn't locate "${esc(address)}". Try adding a town and ZIP — e.g. "123 Main St, Portland, ME 04101".</p></div>`;
}

// ── Representatives: ruled list rows ────────────────────────────────────────
function repsFor(layer, district){
  if (!REPS) return [];
  if (layer === "us_senate") return REPS.us_senate || [];   // statewide — no district
  if (district == null) return [];
  return (REPS[layer] && REPS[layer][String(district)]) || [];
}

function repRow(layer, roleLabel, district, rep){
  const party = PARTY[rep.party] || { label: rep.party || "", color: "var(--text-muted)" };
  const role = district != null ? `${roleLabel} · District ${district}` : roleLabel;
  const href = (CAMPAIGN_FINANCE_LINK[layer] || (() => null))(district, rep);
  const inner = `
    <div>
      <span class="rep-name">${esc(rep.name)}</span><span class="rep-party" style="color:${party.color}">${esc(party.label)}</span>
      <div class="rep-role">${esc(role)}</div>
    </div>`;
  if (href) {
    return `<a class="rep-row" href="${esc(href)}" target="_blank" rel="noopener">${inner}<span class="rep-cta">${RESULT_ACTION_LABEL}</span></a>`;
  }
  return `<div class="rep-row">${inner}</div>`;
}

function repGroup(layer, roleLabel, district){
  const reps = repsFor(layer, district);
  if (!reps.length) {
    return `<div class="rep-row is-empty">
      <div><span class="rep-name">Not found</span>
      <div class="rep-role">${esc(roleLabel)}${district != null ? " · District " + esc(district) : ""}</div></div></div>`;
  }
  return reps.map(r => repRow(layer, roleLabel, district, r)).join("");
}

function renderRepresentatives(values){
  document.getElementById("rep_box").innerHTML = `
    <div class="rep-kicker">In Washington</div>
    ${repGroup("us_senate", "U.S. Senator · represents all of Maine", null)}
    ${repGroup("congressional", "U.S. House", values.congressional)}
    <div class="rep-kicker">In Augusta</div>
    ${repGroup("state_senate", "State Senate", values.state_senate)}
    ${repGroup("state_house", "State House", values.state_house)}
  `;
}

// ── Lookup ──────────────────────────────────────────────────────────────────
async function runLookup(){
  const btn = document.getElementById("lookup");
  const address = document.getElementById("address").value.trim();
  if (!address) return;

  btn.disabled = true; btn.textContent = "Searching…";
  try {
    const geo = await geocode(address);
    if (!geo) { renderNotFound(address); return; }

    const values = {};
    for (const cfg of LAYERS) {
      const gj = await loadGeojson(cfg.file);
      values[cfg.key] = districtAt(gj, geo.lon, geo.lat);
      highlighted[cfg.key] = values[cfg.key];
      buildLayer(cfg, gj);
      refreshLayerStyle(cfg);
    }
    await showLayer(activeLayerKey);
    await repsReady;
    renderResult(geo.display_name, values);
    renderRepresentatives(values);
    map.invalidateSize();

    if (marker) map.removeLayer(marker);
    marker = L.circleMarker([geo.lat, geo.lon], {
      radius: 6, color: "#fff", weight: 2, fillColor: "#1a1a1a", fillOpacity: 1
    }).addTo(map);

    // Ease into the region around the address — close enough to orient
    // ("that's my corner of Maine"), not so close the district context is lost.
    map.flyTo([geo.lat, geo.lon], 8.5, { duration: 0.9 });
    document.getElementById("map_reset").hidden = false;
  } catch (err) {
    document.getElementById("result_box").innerHTML =
      `<div class="errbox"><h4>Something went wrong</h4><p>${esc(err.message)}</p></div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Find my districts";
  }
}

document.getElementById("lookup").addEventListener("click", runLookup);
document.getElementById("address").addEventListener("keydown", e => {
  if (e.key === "Enter") runLookup();
});
</script>
</body>
</html>
