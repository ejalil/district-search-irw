<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>District Search — The Maine Monitor</title>

<!-- Brand fonts: Inter (body) + Lora (headlines) — same as the campaign-finance pages -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Leaflet (map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf (point-in-polygon + union/difference for the Maine mask) -->
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

<style>
  :root {
    --blue: #2c6fbb;      /* Democrat */
    --red: #c0392b;       /* Republican */
    --gray: #6b6b6b;      /* Unenrolled */
    --purple: #8e44ad;    /* Independent */
    --accent: #8989f1;    /* Maine Monitor periwinkle */
    --accent-dark: #6b6bd9;
    --text: #1a1a1a;
    --text-secondary: #666;
    --text-muted: #999;
    --border: #e5e5e5;
    --bg-hover: #fafafc;
    --bg-card: #f9f9fb;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background: #fff;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

  /* ── SEARCH ── */
  /* No page header — this embeds on themainemonitor.org, which supplies its own. */
  .search {
    display: flex; gap: 10px; justify-content: center;
    align-items: stretch; flex-wrap: wrap;
    margin: 40px auto 0; max-width: 680px;
  }
  #address {
    flex: 1 1 420px; min-width: 0;
    padding: 13px 16px; font-size: 1rem; font-family: inherit;
    color: var(--text); background: #fff;
    border: 1px solid var(--border); border-radius: 8px;
    transition: border-color .12s, box-shadow .12s;
  }
  #address::placeholder { color: var(--text-muted); }
  #address:focus {
    outline: 0; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(137,137,241,0.18);
  }
  #lookup {
    flex: 0 0 auto;
    padding: 13px 26px; font-size: 0.95rem; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  #lookup:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  #lookup:disabled { opacity: .6; cursor: default; }

  /* ── RESULT / ADDRESS BAR + ERRORS ── */
  #result_box { margin: 26px auto 0; max-width: 900px; }
  .addr-bar {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 11px 16px; border-radius: 8px;
    font-size: 0.85rem; color: var(--text-secondary); text-align: center;
  }
  .addr-bar b { color: var(--text); font-weight: 600; }
  .errbox {
    border-left: 4px solid var(--red); background: rgba(192,57,43,0.06);
    padding: 16px 20px; border-radius: 8px;
  }
  .errbox h4 { color: var(--red); margin: 0 0 .3rem; font-size: 1rem; }
  .errbox p { margin: 0; font-size: 0.9rem; color: var(--text-secondary); }

  /* ── TWO-COLUMN: map | representatives ── */
  .page-flex {
    display: flex; gap: 40px; align-items: flex-start; margin-top: 32px;
  }
  .map-col, .rep-col { flex: 1 1 50%; min-width: 0; }
  #map { height: 560px; width: 100%; border-radius: 10px; border: 1px solid var(--border); }
  .leaflet-container { font: inherit; }
  button:focus, input:focus, a:focus,
  .leaflet-container:focus, .leaflet-container *:focus { outline: none; }

  /* Section header ("ribbon") — Lora + fading rule, matching the finance pages */
  .ribbon {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;
  }
  .ribbon-text {
    font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 700;
    color: var(--text); line-height: 1.2; white-space: nowrap;
  }
  .ribbon::after {
    content: ''; flex: 1; height: 2px;
    background: linear-gradient(to right, var(--border), transparent); margin-top: 4px;
  }
  .rep-sub {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-muted); margin: 22px 0 10px;
  }
  .rep-sub:first-of-type { margin-top: 14px; }

  /* ── REP CARDS ── */
  .rep-hint {
    color: var(--text-muted); font-size: 0.9rem;
    padding: 24px 4px; text-align: left;
  }
  .rep-card {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 14px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; text-decoration: none; color: inherit;
    background: #fff; transition: background .12s, border-color .12s, box-shadow .12s;
  }
  a.rep-card:hover {
    background: var(--bg-hover); border-color: #d7d7ea;
    box-shadow: 0 2px 10px rgba(20,20,40,0.05);
  }
  .rep-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .rep-body { flex: 1 1 auto; min-width: 0; }
  .rep-name { font-weight: 600; font-size: 0.98rem; line-height: 1.25; }
  .rep-role { font-size: 0.8rem; color: var(--text-secondary); margin-top: 1px; }
  .rep-tag {
    flex: 0 0 auto; font-size: 0.68rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .rep-cta {
    flex: 0 0 auto; font-size: 0.8rem; font-weight: 600; color: var(--accent);
    opacity: 0; transform: translateX(-4px); transition: opacity .12s, transform .12s;
    white-space: nowrap;
  }
  a.rep-card:hover .rep-cta { opacity: 1; transform: translateX(0); }
  .rep-card.is-static { cursor: default; }
  .rep-note {
    flex: 0 0 auto; font-size: 0.72rem; color: var(--text-muted); font-style: italic;
    white-space: nowrap;
  }

  @media (max-width: 820px) {
    .page-flex { flex-direction: column; }
    .map-col, .rep-col { flex: 1 1 100%; width: 100%; }
    #map { height: 420px; }
    .page-header h1 { font-size: 2rem; }
    .rep-cta { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="search">
    <input type="text" id="address" placeholder="e.g. 123 Main St, Portland, ME 04101" />
    <button id="lookup">Look Up Districts</button>
  </div>

  <div id="result_box"></div>

  <div class="page-flex" id="results">
    <div class="map-col">
      <div id="map"></div>
    </div>
    <div class="rep-col">
      <div class="ribbon"><span class="ribbon-text">Your Representatives</span></div>
      <div id="rep_box">
        <div class="rep-hint">Search an address to see who represents you.</div>
      </div>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// VERSION A — Voter Guide. Rep cards link out to the campaign-finance pages.
// To make Version B (Statehouse hub), swap CAMPAIGN_FINANCE_LINK for the
// district/lawmaker page URLs and change RESULT_ACTION_LABEL below. Nothing
// else needs to change.
// ─────────────────────────────────────────────────────────────────────────────
const RESULT_ACTION_LABEL = "Campaign finance →";

// PLACEHOLDER LINKS — real per-lawmaker URLs aren't finalized yet. Each function
// receives (district, rep) and returns a URL, or null for "no page yet" (renders
// a non-clickable card). Wire the real URLs here when they're ready.
const CF_BASE = "https://aarushisahejpal.github.io/maine-monitor-campaign-finance/viz/";
const CAMPAIGN_FINANCE_LINK = {
  us_senate:     (d, r) => null,                              // TODO: federal finance page
  congressional: (d, r) => null,                              // TODO: federal finance page
  state_senate:  (d, r) => CF_BASE + "senate.html",          // TODO: swap for per-lawmaker URL
  state_house:   (d, r) => CF_BASE + "house.html",           // TODO: swap for per-lawmaker URL
};

// Party code → display label + brand color (matches the finance pages).
const PARTY = {
  D: { label: "Democrat",    color: "var(--blue)" },
  R: { label: "Republican",  color: "var(--red)" },
  I: { label: "Independent", color: "var(--purple)" },
  U: { label: "Unenrolled",  color: "var(--gray)" },
};

// ── Config: the three boundary layers ───────────────────────────────────────
const DISTRICT_FIELD = "DISTRICT";
const LAYERS = [
  { key:"congressional", file:"Maine_Voting_Districts_2021_US_Congress.geojson",
    group:"Congressional Districts", labelPrefix:"Congressional District", border:"#2471a3" },
  { key:"state_house", file:"Maine_Voting_Districts_2021_House.geojson",
    group:"State House Districts", labelPrefix:"State House District", border:"#a04000" },
  { key:"state_senate", file:"Maine_Voting_Districts_2021_State_Senate.geojson",
    group:"State Senate Districts", labelPrefix:"State Senate District", border:"#6c3483" },
];

const HIGHLIGHT_FILL = "#8989f1";      // brand periwinkle
const HIGHLIGHT_BORDER = "#5b5bd6";
const DEFAULT_FILL = "#d9d9d9";

// ── Map setup (CartoDB Positron) ─────────────────────────────────────────────
// zoomSnap 0.25 lets fitBounds pick a fractional zoom, so Maine fills the frame.
const map = L.map("map", { minZoom: 6, zoomSnap: 0.25 }).setView([45.25, -69.0], 6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 30
}).addTo(map);

let marker = null;
let layersControl = null;
let maineBoundary = null;
const drawn = {};
const highlighted = {};
const geojsonCache = {};

async function loadGeojson(file) {
  if (geojsonCache[file]) return geojsonCache[file];
  const resp = await fetch(file);
  if (!resp.ok) throw new Error("Could not load " + file);
  geojsonCache[file] = await resp.json();
  return geojsonCache[file];
}

// Current officeholders, keyed by (layer, district). Loaded once at startup.
let REPS = null;
const repsReady = fetch("reps.json")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("reps.json " + r.status)))
  .then(j => { REPS = j; })
  .catch(err => { console.error("Could not load reps.json:", err); });

// Gray-mask everything outside Maine and fit the view to the state on load.
async function initMaineView() {
  try {
    const gj = await loadGeojson(LAYERS[0].file);
    maineBoundary = turf.union(gj);
    const world = turf.bboxPolygon([-100, 10, -40, 60]);
    const mask = turf.difference(turf.featureCollection([world, maineBoundary]));

    L.geoJSON(mask, { style: { fillColor: "#e9e9ef", fillOpacity: 0.85, stroke: false }, interactive: false }).addTo(map);
    L.geoJSON(maineBoundary, { style: { fill: false, color: "#999", weight: 1.5 }, interactive: false }).addTo(map);

    const bounds = L.geoJSON(maineBoundary).getBounds();
    map.fitBounds(bounds, { padding: [2,2] });
    map.setMaxBounds(bounds.pad(0.4));
  } catch (err) {
    console.error("Could not build Maine mask:", err);
  }
}
initMaineView();

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function styleFor(cfg, districtValue, highlightValue) {
  const isHighlighted = highlightValue != null && String(districtValue) === String(highlightValue);
  if (isHighlighted) {
    return { fillColor: HIGHLIGHT_FILL, fillOpacity: 0.7, color: HIGHLIGHT_BORDER, weight: 3 };
  }
  return { fillColor: DEFAULT_FILL, fillOpacity: 0.25, color: cfg.border, weight: 1 };
}

function buildLayer(cfg, gj){
  if (drawn[cfg.key]) return drawn[cfg.key];
  drawn[cfg.key] = L.geoJSON(gj, {
    style: f => styleFor(cfg, f.properties[DISTRICT_FIELD], highlighted[cfg.key]),
    onEachFeature: (f, lyr) => {
      lyr.on("mouseover", () => lyr.setStyle({ weight: 4 }));
      lyr.on("mouseout", () =>
        lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
    }
  });
  return drawn[cfg.key];
}

function refreshLayerStyle(cfg){
  const layer = drawn[cfg.key];
  if (!layer) return;
  layer.eachLayer(lyr =>
    lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
}

function rebuildLayersControl(){
  if (layersControl) map.removeControl(layersControl);
  const baseLayers = {};
  for (const cfg of LAYERS) if (drawn[cfg.key]) baseLayers[cfg.group] = drawn[cfg.key];
  layersControl = L.control.layers(baseLayers, null, { collapsed:false }).addTo(map);

  const anyShown = LAYERS.some(cfg => drawn[cfg.key] && map.hasLayer(drawn[cfg.key]));
  if (!anyShown) {
    const first = LAYERS.find(cfg => drawn[cfg.key]);
    if (first) drawn[first.key].addTo(map);
  }
}

// ── Geocode (Nominatim) ──────────────────────────────────────────────────────
async function geocode(address){
  if (!/maine|,\s*me\b/i.test(address)) address = address + ", Maine";
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="
            + encodeURIComponent(address);
  const resp = await fetch(url, { headers:{ "Accept":"application/json" } });
  if (!resp.ok) return null;
  const data = await resp.json();
  if (!data.length) return null;
  return { lat:+data[0].lat, lon:+data[0].lon, display_name:data[0].display_name };
}

function districtAt(gj, lon, lat){
  const pt = turf.point([lon, lat]);
  for (const f of gj.features) {
    if (turf.booleanPointInPolygon(pt, f)) return String(f.properties[DISTRICT_FIELD]);
  }
  return null;
}

// ── Result box ──────────────────────────────────────────────────────────────
function renderResult(displayName) {
  document.getElementById("result_box").innerHTML =
    `<div class="addr-bar"><b>Showing results for:</b> ${esc(displayName)}</div>`;
}

function renderNotFound(address){
  document.getElementById("result_box").innerHTML =
    `<div class="errbox"><h4>Address not found</h4><p>We couldn't locate "${esc(address)}". Try adding a town and ZIP — e.g. "123 Main St, Portland, ME 04101".</p></div>`;
}

// ── Representative cards ─────────────────────────────────────────────────────
function repsFor(layer, district){
  if (!REPS) return [];
  if (layer === "us_senate") return REPS.us_senate || [];   // statewide — no district
  if (district == null) return [];
  return (REPS[layer] && REPS[layer][String(district)]) || [];
}

// One clickable (or static) card per officeholder.
function repCard(layer, roleLabel, district, rep){
  const party = PARTY[rep.party] || { label: rep.party || "", color: "var(--text-muted)" };
  const role = district != null ? `${roleLabel} · District ${district}` : roleLabel;
  const href = (CAMPAIGN_FINANCE_LINK[layer] || (() => null))(district, rep);
  const inner = `
    <span class="rep-dot" style="background:${party.color}"></span>
    <div class="rep-body">
      <div class="rep-name">${esc(rep.name)}</div>
      <div class="rep-role">${esc(role)}</div>
    </div>
    <span class="rep-tag" style="color:${party.color}">${esc(party.label)}</span>`;
  if (href) {
    return `<a class="rep-card" href="${esc(href)}" target="_blank" rel="noopener">${inner}<span class="rep-cta">${RESULT_ACTION_LABEL}</span></a>`;
  }
  return `<div class="rep-card is-static">${inner}<span class="rep-note">page coming soon</span></div>`;
}

// A labeled group of cards for one layer (may be 0, 1, or 2 officeholders).
function repGroup(layer, roleLabel, district){
  const reps = repsFor(layer, district);
  if (!reps.length) {
    return `<div class="rep-card is-static">
      <span class="rep-dot" style="background:var(--text-muted)"></span>
      <div class="rep-body"><div class="rep-name" style="color:var(--text-muted)">Not found</div>
      <div class="rep-role">${esc(roleLabel)}${district != null ? " · District " + esc(district) : ""}</div></div></div>`;
  }
  return reps.map(r => repCard(layer, roleLabel, district, r)).join("");
}

function renderRepresentatives(values){
  document.getElementById("rep_box").innerHTML = `
    <div class="rep-sub">Federal</div>
    ${repGroup("us_senate", "U.S. Senate", null)}
    ${repGroup("congressional", "U.S. House", values.congressional)}
    <div class="rep-sub">State</div>
    ${repGroup("state_senate", "State Senate", values.state_senate)}
    ${repGroup("state_house", "State House", values.state_house)}
  `;
}

// ── Lookup ──────────────────────────────────────────────────────────────────
async function runLookup(){
  const btn = document.getElementById("lookup");
  const address = document.getElementById("address").value.trim();
  if (!address) return;

  btn.disabled = true; btn.textContent = "Looking up…";
  try {
    const geo = await geocode(address);
    if (!geo) { renderNotFound(address); return; }

    const values = {};
    for (const cfg of LAYERS) {
      const gj = await loadGeojson(cfg.file);
      values[cfg.key] = districtAt(gj, geo.lon, geo.lat);
      highlighted[cfg.key] = values[cfg.key];
      buildLayer(cfg, gj);
      refreshLayerStyle(cfg);
    }
    rebuildLayersControl();
    await repsReady;
    renderResult(geo.display_name);
    renderRepresentatives(values);
    map.invalidateSize();

    if (marker) map.removeLayer(marker);
    marker = L.marker([geo.lat, geo.lon]).addTo(map);
  } catch (err) {
    document.getElementById("result_box").innerHTML =
      `<div class="errbox"><h4>Something went wrong</h4><p>${esc(err.message)}</p></div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Look Up Districts";
  }
}

document.getElementById("lookup").addEventListener("click", runLookup);
document.getElementById("address").addEventListener("keydown", e => {
  if (e.key === "Enter") runLookup();
});
</script>
</body>
</html>
