<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maine District Lookup</title>

<!-- Leaflet (map) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf (point-in-polygon + union/difference for the Maine mask) -->
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #212529;
    line-height: 1.5;
    margin: 0;
    background: #fff;
  }
  .content { max-width: 1400px; margin: 0 auto; padding: 28px 24px 40px; }
  h1 {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 2.1rem;
    font-weight: 600;
    margin: 0 0 1.2rem;
    letter-spacing: -.01em;
  }

  label { display: block; font-weight: 400; margin: 0 0 .35rem; }
  input[type=text] {
    width: 100%; max-width: 520px; display: block;
    padding: .375rem .75rem; font-size: 1rem; line-height: 1.5;
    color: #212529; background: #fff; border: 1px solid #ced4da; border-radius: .375rem;
  }
  input[type=text]:focus {
    outline: 0; border-color: #86b7fe; box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
  }
  .btn-primary {
    margin-top: 1rem; display: inline-block;
    padding: .375rem .75rem; font-size: 1rem; font-weight: 400; line-height: 1.5;
    color: #fff; background: #0d6efd; border: 1px solid #0d6efd; border-radius: .375rem;
    cursor: pointer;
  }
  .btn-primary:hover { background: #0b5ed7; border-color: #0a58ca; }
  .btn-primary:disabled { background: #6ea8fe; border-color: #6ea8fe; cursor: default; }
  button:focus, input:focus, a:focus,
  .leaflet-container:focus, .leaflet-container *:focus { outline: none; }

  .district-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 20px 0;
    margin-top: 1rem;
    text-align: center;
  }
  .district-table th {
    font-weight: 600;
    padding: 8px 10px 10px 10px;
    border-bottom: 2px solid #ced4da;
  }
  .district-table td {
    padding: 12px 10px;
    text-align: center;
    vertical-align: middle;
  }

  #result_box { margin: 1.4rem 0 1rem; }
  .addr-bar {
    background: #f8f9fa; padding: 10px 16px; border-radius: 6px;
    margin-bottom: 12px; font-size: .9rem; color: #555;
  }
  .errbox {
    border-left: 6px solid #c0392b; background: #c0392b18;
    padding: 16px 20px; border-radius: 6px;
  }
  .errbox h4 { color: #c0392b; margin: 0 0 .4rem; }
  .errbox p { margin: 0; }
  .leaflet-container { font: inherit; }

  /* ── Two-column layout: map takes half, representatives take the other half ── */
  .page-flex {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    margin-top: 1.5rem;
  }
  .map-col, .rep-col {
    flex: 1 1 50%;
    min-width: 0;
  }
  #map {
    height: 600px;
    width: 100%;
    border-radius: 4px;
  }
  .rep-col h2 {
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 1.5rem;
    margin: 0 0 1rem;
  }
  .rep-placeholder {
    background: #f8f9fa;
    border: 1px dashed #ced4da;
    border-radius: 6px;
    padding: 20px;
    min-height: 200px;
    color: #555;
  }
  .rep-placeholder ul { margin: .5rem 0 0; padding-left: 1.2rem; }
  .rep-placeholder li { margin-bottom: .4rem; }
</style>
</head>
<body>
<div class="content">

  <h1>Maine District Lookup</h1>

  <label for="address">Enter a Maine address:</label>
  <input type="text" id="address" placeholder="e.g. 123 Main St, Portland, ME" />
  <button id="lookup" class="btn-primary">Look Up Districts</button>

  <div id="result_box"></div>

  <div class="page-flex">
    <div class="map-col">
      <div id="map"></div>
    </div>
    <div class="rep-col">
      <h2>Your Representatives</h2>
      <div id="rep_box" class="rep-placeholder">
        <p>Look up an address to see district info here. Representative details will be added later.</p>
      </div>
    </div>
  </div>

</div>

<script>
// ── Config: the three boundary layers ───────────────────────────────────────
const DISTRICT_FIELD = "DISTRICT";
const LAYERS = [
  { key:"congressional", file:"Maine_Voting_Districts_2021_US_Congress.geojson",
    group:"Congressional Districts", badge:"U.S. Congressional District",
    labelPrefix:"Congressional District", border:"#2471a3" },
  { key:"state_house", file:"Maine_Voting_Districts_2021_House.geojson",
    group:"State House Districts", badge:"Maine State House District",
    labelPrefix:"State House District", border:"#a04000" },
  { key:"state_senate", file:"Maine_Voting_Districts_2021_State_Senate.geojson",
    group:"State Senate Districts", badge:"Maine State Senate District",
    labelPrefix:"State Senate District", border:"#6c3483" },
];

const HIGHLIGHT_FILL = "#ffb300";
const HIGHLIGHT_BORDER = "#7a4a00";
const DEFAULT_FILL = "#d9d9d9";

// ── Map setup (CartoDB Positron) ─────────────────────────────────────────────
const map = L.map("map", { minZoom: 6 }).setView([45.25, -69.0], 6);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 30
}).addTo(map);

let marker = null;
let layersControl = null;
let maineBoundary = null;         // union of all congressional districts = Maine outline
const drawn = {};                 // key -> Leaflet layer (built lazily)
const highlighted = {};           // key -> district value currently highlighted
const geojsonCache = {};          // file -> parsed GeoJSON (lazy-loaded once)

async function loadGeojson(file) {
  if (geojsonCache[file]) return geojsonCache[file];
  const resp = await fetch(file);
  if (!resp.ok) throw new Error("Could not load " + file);
  geojsonCache[file] = await resp.json();
  return geojsonCache[file];
}

// Build a gray "everything outside Maine" mask and zoom/fit to the state
// on first load, so the app opens already focused on Maine.
async function initMaineView() {
  try {
    const gj = await loadGeojson(LAYERS[0].file); // congressional districts tile the whole state
    maineBoundary = turf.union(gj);

    const world = turf.bboxPolygon([-100, 10, -40, 60]); // generously covers the visible area
    const mask = turf.difference(turf.featureCollection([world, maineBoundary]));

    L.geoJSON(mask, {
      style: { fillColor: "#888", fillOpacity: 0.55, stroke: false },
      interactive: false
    }).addTo(map);

    L.geoJSON(maineBoundary, {
      style: { fill: false, color: "#555", weight: 1.5 },
      interactive: false
    }).addTo(map);

    const bounds = L.geoJSON(maineBoundary).getBounds();
    map.fitBounds(bounds, { padding: [7.5,7.5] });
    map.setMaxBounds(bounds.pad(0.4));
  } catch (err) {
    console.error("Could not build Maine mask:", err);
  }
}
initMaineView();

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

// Every district is plain gray except the one matching the looked-up address,
// which gets a bold, distinct highlight color.
function styleFor(cfg, districtValue, highlightValue) {
  const isHighlighted = highlightValue != null && String(districtValue) === String(highlightValue);
  if (isHighlighted) {
    return { fillColor: HIGHLIGHT_FILL, fillOpacity: 0.75, color: HIGHLIGHT_BORDER, weight: 3 };
  }
  return { fillColor: DEFAULT_FILL, fillOpacity: 0.25, color: cfg.border, weight: 1 };
}

// Builds (but does NOT add to the map) the Leaflet layer for one district set.
function buildLayer(cfg, gj){
  if (drawn[cfg.key]) return drawn[cfg.key];
  drawn[cfg.key] = L.geoJSON(gj, {
    style: f => styleFor(cfg, f.properties[DISTRICT_FIELD], highlighted[cfg.key]),
    onEachFeature: (f, lyr) => {
      lyr.bindTooltip(cfg.labelPrefix + " " + f.properties[DISTRICT_FIELD], { sticky:true });
      lyr.on("mouseover", () => lyr.setStyle({ weight: 4 }));
      lyr.on("mouseout", () =>
        lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
    }
  });
  return drawn[cfg.key];
}

// Re-applies styling to an already-built layer (used after a new lookup
// changes which district should be highlighted).
function refreshLayerStyle(cfg){
  const layer = drawn[cfg.key];
  if (!layer) return;
  layer.eachLayer(lyr =>
    lyr.setStyle(styleFor(cfg, lyr.feature.properties[DISTRICT_FIELD], highlighted[cfg.key])));
}

// Rebuilds the layer-switcher control as "base layers" (radio-button style).
function rebuildLayersControl(){
  if (layersControl) map.removeControl(layersControl);
  const baseLayers = {};
  for (const cfg of LAYERS) if (drawn[cfg.key]) baseLayers[cfg.group] = drawn[cfg.key];
  layersControl = L.control.layers(baseLayers, null, { collapsed:false }).addTo(map);

  const anyShown = LAYERS.some(cfg => drawn[cfg.key] && map.hasLayer(drawn[cfg.key]));
  if (!anyShown) {
    const first = LAYERS.find(cfg => drawn[cfg.key]);
    if (first) drawn[first.key].addTo(map);
  }
}

// ── Geocode (Nominatim) ──────────────────────────────────────────────────────
async function geocode(address){
  if (!/maine|,\s*me\b/i.test(address)) address = address + ", Maine";
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="
            + encodeURIComponent(address);
  const resp = await fetch(url, { headers:{ "Accept":"application/json" } });
  if (!resp.ok) return null;
  const data = await resp.json();
  if (!data.length) return null;
  return { lat:+data[0].lat, lon:+data[0].lon, display_name:data[0].display_name };
}

function districtAt(gj, lon, lat){
  const pt = turf.point([lon, lat]);
  for (const f of gj.features) {
    if (turf.booleanPointInPolygon(pt, f)) return String(f.properties[DISTRICT_FIELD]);
  }
  return null;
}

// ── Result box (Address bar + district table) ───────────────────────────────
function renderResult(displayName, values) {
  document.getElementById("result_box").innerHTML = `
    <div class="addr-bar">
      <b>Address:</b> ${esc(displayName)}
    </div>

    <table class="district-table">
      <thead>
        <tr>
          <th>Congressional District</th>
          <th>State House District</th>
          <th>State Senate District</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>${values.congressional ?? "Not found"}</td>
          <td>${values.state_house ?? "Not found"}</td>
          <td>${values.state_senate ?? "Not found"}</td>
        </tr>
      </tbody>
    </table>
  `;
}

function renderNotFound(address){
  document.getElementById("result_box").innerHTML =
    `<div class="errbox"><h4>Address not found</h4><p>Could not geocode "${esc(address)}". Try a more complete address.</p></div>`;
}

// Stub panel — swap this in once you have actual representative data/lookup.
function renderRepresentatives(values){
  document.getElementById("rep_box").innerHTML = `
    <p>District info for this address:</p>
    <ul>
      <li>Congressional District ${values.congressional ?? "N/A"}: <em>TBD</em></li>
      <li>State House District ${values.state_house ?? "N/A"}: <em>TBD</em></li>
      <li>State Senate District ${values.state_senate ?? "N/A"}: <em>TBD</em></li>
    </ul>
  `;
}

// ── Lookup ──────────────────────────────────────────────────────────────────
async function runLookup(){
  const btn = document.getElementById("lookup");
  const address = document.getElementById("address").value.trim();
  if (!address) return;

  btn.disabled = true; btn.textContent = "Looking up…";
  try {
    const geo = await geocode(address);
    if (!geo) { renderNotFound(address); return; }

    const values = {};
    for (const cfg of LAYERS) {
      const gj = await loadGeojson(cfg.file);
      values[cfg.key] = districtAt(gj, geo.lon, geo.lat);
      highlighted[cfg.key] = values[cfg.key];
      buildLayer(cfg, gj);
      refreshLayerStyle(cfg);
    }
    rebuildLayersControl();
    renderResult(geo.display_name, values);
    renderRepresentatives(values);

    if (marker) map.removeLayer(marker);
    marker = L.marker([geo.lat, geo.lon]).addTo(map);
    // Note: no map.setView()/zoom here on purpose — the district highlight
    // color is what shows the result, not a camera move.
  } catch (err) {
    document.getElementById("result_box").innerHTML =
      `<div class="errbox"><h4>Something went wrong</h4><p>${esc(err.message)}</p></div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Look Up Districts";
  }
}

document.getElementById("lookup").addEventListener("click", runLookup);
document.getElementById("address").addEventListener("keydown", e => {
  if (e.key === "Enter") runLookup();
});
</script>
</body>
</html>
